services:
  siem-dashboard:
    container_name: siem-dashboard-container
    image: ${REGISTRY_USER}/siem-dashboard:${IMAGE_TAG:-latest}
    build:
      context: . 
      dockerfile: apps/dashboard/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8001:8001"
    environment:
      - DASHBOARD_PASSWORD_HASH=${DASHBOARD_PASSWORD_HASH}
      - DASHBOARD_JWT_SECRET_KEY=${DASHBOARD_JWT_SECRET_KEY}
      - DASHBOARD_ENGINE_URL=ws://siem-engine:8000/ws/dashboard
    depends_on:
      - siem-engine
    restart: unless-stopped

  siem-engine:
    container_name: siem-engine-container
    image: ${REGISTRY_USER}/siem-engine:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SIEM_INGEST_TOKEN=${INGEST_TOKEN}
    restart: unless-stopped